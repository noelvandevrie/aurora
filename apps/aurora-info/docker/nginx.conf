events {
    worker_connections  1024;
}

http {
    upstream aurora_core {
        server core:3000;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/src/app;
            index  index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            root   /usr/src/app;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Only the two anonymized endpoints are public; the rest of the core API
        # (logins, integration-key endpoints, ...) must stay unreachable from here.
        location = /api/public/info/room-status {
            limit_except GET { deny all; }
            proxy_pass http://aurora_core;
            # Overwrite, never append: the core gates the playing artist on this.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location = /api/public/info/pc-usage {
            limit_except GET { deny all; }
            proxy_pass http://aurora_core;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /api/ {
            return 404;
        }
    }
}
